# Sicherheits-Header fuer JEDE Antwort des Frontends. Als eigene Datei, weil
# nginx add_header NICHT kumulativ vererbt: sobald ein location-Block selbst ein
# add_header setzt (z.B. Cache-Control), gelten dort nur noch seine eigenen —
# die des server-Blocks fallen weg. Deshalb in jedem Block mit eigenem
# add_header per `include` wiederholen (siehe nginx.conf).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP: SPA + API sind same-origin (nginx proxyt /api). Scripts nur aus eigener
# Herkunft; Inline-Styles für React-Style-Attribute erlaubt.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
