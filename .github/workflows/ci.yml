name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Kein Job schreibt ins Repo -- das Token bekommt nur Leserechte.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"  # = FROM in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # requirements-dev.txt zusaetzlich zum Lock: pytest/httpx sind bewusst
      # NICHT im Lock (das geht ins Produktions-Image, siehe Dockerfile) --
      # dieser Job braucht sie aber fuer die Testlaeufe unten.
      - run: pip install -r requirements.lock -r requirements-dev.txt
      # Blockierend: findet ungenutzte Importe, undefinierte Namen und
      # veraenderliche Default-Argumente. Konfiguration in backend/pyproject.toml.
      # Versionen fest: ein neues ruff-Release mit zusaetzlichen Regeln soll
      # nicht ungefragt fremde Pull Requests rot faerben.
      - run: pip install ruff==0.17.0 && ruff check .
      - run: pytest
      # Ein neuer Advisory stoppt den Merge: die Lock-Datei macht den Befund
      # reproduzierbar und verhindert, dass ein Deploy ihn stillschweigend uebernimmt.
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock

  # Eigener Job statt Anhaengsel am Backend-Job: die Runner-Tests liefen dort
  # unter Python 3.11, das Runner-Image ist aber python:3.12 (runner/Dockerfile).
  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"  # = FROM in runner/Dockerfile
          cache: pip
          cache-dependency-path: runner/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest
      # Der Runner fuehrt Teilnehmer-Code aus -- seine Abhaengigkeiten gehoeren
      # genauso geprueft wie die des Backends.
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"  # = FROM in frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # War konfiguriert (package.json "lint": "oxlint"), lief aber nie in CI.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev

  # Baut alle drei Images ohne Push. Ohne diesen Job faellt ein kaputtes
  # Dockerfile (z.B. durch eine neue Paketinstallation im Runner) erst beim
  # Deploy auf, nicht schon in CI.
  docker-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build ./backend
      - run: docker build ./frontend
      - run: docker build ./runner

  # Deckt den Postgres-spezifischen Pfad aus app/db_migrate.py ab (Advisory-Lock,
  # lock_timeout) -- der Job "backend" oben laeuft nur gegen SQLite. Danach
  # laeuft die ganze Testsuite noch einmal gegen Postgres: Produktion ist
  # Postgres, und Seed/Content-Sync beim Start, Kaskaden und ID-Vergabe
  # (Sequenzen statt wiederverwendeter rowids) verhalten sich dort anders.
  backend-postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intnetwork
          POSTGRES_USER: intnetwork
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intnetwork -d intnetwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - name: run_migrations() gegen echtes Postgres (Advisory-Lock, lock_timeout)
        env:
          DATABASE_URL: postgresql://intnetwork:testpass@localhost:5432/intnetwork
          SECRET_KEY: ci-postgres-secret-not-the-default-0123456789
        # Block-Scalar (|): das ':' in der Meldung wuerde einen plain-Scalar-run
        # als YAML-Mapping fehlinterpretieren (mapping values are not allowed here).
        run: |
          python -c "from app.db_migrate import run_migrations; run_migrations(); print('Migrationen liefen gegen Postgres durch')"
      # Regression (v1.24.1 bis v1.41.1): env.py liess die Migrationen in einer nie
      # committeten Transaktion laufen -- der Schritt oben war gruen, die DB danach
      # leer. Deshalb in einem NEUEN Prozess pruefen, dass das Schema wirklich da ist.
      - name: Migrationen sind persistiert (alembic_version + Kerntabelle)
        env:
          DATABASE_URL: postgresql://intnetwork:testpass@localhost:5432/intnetwork
          SECRET_KEY: ci-postgres-secret-not-the-default-0123456789
        run: |
          python -c "from sqlalchemy import text; from app.database import engine; c = engine.connect(); print('alembic_version =', c.execute(text('SELECT version_num FROM alembic_version')).scalar_one()); c.execute(text('SELECT count(*) FROM participant'))"
      # tests/conftest.py setzt DATABASE_URL nur per setdefault -- der Wert hier
      # gewinnt, die App (Migration, Seed, Content-Sync) laeuft gegen Postgres.
      - name: Testsuite gegen Postgres
        env:
          DATABASE_URL: postgresql://intnetwork:testpass@localhost:5432/intnetwork
        run: pytest
